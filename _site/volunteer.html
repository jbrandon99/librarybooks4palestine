    <script type="text/javascript">
        function setTheme(theme) {
          document.documentElement.setAttribute('data-theme', theme);
          localStorage.setItem('theme', theme);
        }

        // Get saved theme or default
        const savedTheme = localStorage.getItem('theme') || 'green';
        setTheme(savedTheme);

        // Toggle function
        function toggleTheme() {
          const current = document.documentElement.getAttribute('data-theme');
          const next = current === 'green' ? 'light' : 'green';
          setTheme(next);
        }

        function copyCode() {
          // Get the code element
          const codeElement = document.getElementById('template-code');
          const codeText = codeElement.textContent;
          
          // Use the Clipboard API
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(codeText)
              .then(() => {
                showCopiedFeedback();
              })
              .catch(() => {
                // Fallback for older browsers
                fallbackCopy(codeText);
              });
          } else {
            // Fallback for older browsers
            fallbackCopy(codeText);
          }
        }

        function fallbackCopy(text) {
          // Create a temporary textarea
          const textarea = document.createElement('textarea');
          textarea.value = text;
          textarea.style.position = 'fixed';
          textarea.style.opacity = '0';
          textarea.style.left = '-9999px';
          document.body.appendChild(textarea);
          
          // Select and copy
          textarea.select();
          try {
            document.execCommand('copy');
            showCopiedFeedback();
          } catch (err) {
            alert('Could not copy text. Please select and copy manually.');
          }
          
          // Remove the textarea
          document.body.removeChild(textarea);
        }

        function showCopiedFeedback() {
          const btn = document.querySelector('.copy-btn');
          const originalText = btn.textContent;
          
          btn.textContent = '✅ Copied!';
          btn.classList.add('copied');
          
          setTimeout(() => {
            btn.textContent = originalText;
            btn.classList.remove('copied');
          }, 2000);
        }


        // Check screen size and add/remove class
        function toggleButtonClass() {
          const button = document.getElementById('themeToggleItem');
          if (button) {
            if (window.innerWidth >= 1024) {
              button.classList.add('theme-button');
              //alert('more');
            } else {
              button.classList.remove('theme-button');
              //alert('less');
            }
          }
        }

        document.addEventListener('DOMContentLoaded', function() {
          toggleButtonClass();
          
          //once loaded we can remove the hidden attribute
          const toggleMenuButton = document.getElementById('menuToggleButton');
          if (toggleMenuButton) {
            toggleMenuButton.removeAttribute('style');
          }
        });

        // Run on resize
        let resizeTimer;
        window.addEventListener('resize', () => {
          clearTimeout(resizeTimer);
          resizeTimer = setTimeout(toggleButtonClass, 100);
        });

        function toggleMenu (menuToggle) {
          var menu = document.getElementById('primaryNav');
          menu.classList.toggle("is-active");
          menuToggle.classList.toggle("is-active");
        }
    </script>
